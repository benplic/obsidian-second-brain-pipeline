# Copy to config.yaml (gitignored) and edit.
# Relative paths are resolved from the folder containing this file.
# On Windows use forward slashes: "D:/Obsidian/The Brain".

# Root of your Obsidian vault (the folder that contains "3 - Resources").
vault_path: "./examples/sample-vault/The Brain"
resources_subdir: "3 - Resources"

# Where queue files live (clean_metadata.json, organized_tiktoks.csv).
data_dir: "./data"

# The iOS Shortcut appends shared URLs here. Point it at your synced drive, e.g.
#   "G:/My Drive/Inbox/pending_links.txt"   or   "~/iCloudDrive/Inbox/pending_links.txt"
pending_links_path: "./data/pending_links.txt"

# Meta "Your saved items" export (personal data, keep it out of git).
instagram_export_path: "./data/saved_posts.json"

# Persistent record of every URL that became a card or was tossed.
# Default (leave null): <vault_path>/.second-brain/url_ledger.jsonl, a hidden
# folder Obsidian does not index, so it syncs and backs up with the vault.
# Losing it only means deleted cards could be re-ingested.
ledger_path: null

extract:
  workers: 10
  timeout_seconds: 20
  checkpoint_every: 10
  # Browser to read cookies from if Instagram blocks anonymous pulls (e.g. "chrome", "edge").
  cookies_from_browser: null

gemini:
  model: "gemini-3.6-flash"
  batch_size: 100              # free tier: ~20 requests/day, so batch hard
  max_retries: 5
  backoff_base_seconds: 8      # delay = base * 2^attempt + jitter
  jitter_seconds: [1, 3]
  pause_between_batches_seconds: 10

model_a:
  inbox_path: null             # default: <vault>/3 - Resources/Inbox/pending_links.txt
  metadata_snapshot_path: null # optional old clean_metadata.json for richer enrich prompts
  batch_size: 10
  backoff_base_seconds: 15
  confidence_threshold: 0.65

# Tiered, budget-capped re-analysis of existing vault cards (`second-brain crush`).
# Each URL escalates only as far as needed:
#   captions (free) -> low-bitrate audio + local faster-whisper (free) -> <=512px keyframes (Gemini images)
# null quota fields = unlimited (429 backoff only). Add GEMINI_API_KEY_2 etc. for rotation.
crusher:
  # model: omitted = inherit gemini.model above. Pick the cheapest Flash/Flash-Lite your key has.
  fallback_model: null
  batch_size: 10               # cards per progress checkpoint
  requests_per_minute: null    # e.g. 15 on free tier
  requests_per_day: null       # e.g. 20 on free tier (resets midnight Pacific)
  tokens_per_minute: null
  # Base key names. GEMINI_API_KEY_2, _3, ... are picked up automatically for as
  # many consecutive numbers as are set. When one key's daily quota is spent,
  # the same request retries on the next key. The run stops after the last key.
  api_key_env_vars: ["GEMINI_API_KEY", "GOOGLE_API_KEY"]
  media_resolution: "MEDIA_RESOLUTION_LOW"
  thinking_level: "LOW"        # thinking tokens bill as output; null = model default
  max_video_seconds: 180
  max_passes: 3                # each retry escalates: text -> keyframes -> denser keyframes
  confidence_threshold: 0.55
  include_folders: []          # empty = all category folders under 3 - Resources
  skip_statuses: ["tossed"]
  prompt_version: "2"          # bump to re-run summary/classification (downloads + transcripts are cached)
  geocoder: "nominatim"        # or "none"
  geocoder_user_agent: "obsidian-second-brain-pipeline/0.1"
  cookies_from_browser: null   # inherits extract.cookies_from_browser when omitted
  backoff_base_seconds: 15

  # yt-dlp pacing (prevents 429s / soft IP bans across 2,000 URLs)
  ytdlp_min_interval_seconds: 2
  ytdlp_jitter_seconds: 1
  ytdlp_retries: 3
  ytdlp_max_attempts: 3
  ytdlp_backoff_base_seconds: 30
  unavailable_after_attempts: 3  # transient failures across this many runs -> unavailable

  # Tier thresholds
  min_transcript_words: 25     # fewer caption words -> run audio transcription
  min_speech_ratio: 0.2        # less speech than this -> treat as silent -> keyframes
  whisper_model: "base"        # needs: pip install -e ".[transcribe]"
  whisper_device: "auto"
  whisper_compute_type: "int8"
  keyframe_interval_seconds: 8 # at least one frame per N seconds (plus scene cuts)
  max_keyframes: 16
  keyframe_max_px: 512
  scene_threshold: 0.35
  visual_mode: "frames"        # "video" sends the raw low-res clip (much more expensive)

  # Classification: "auto" uses Jev when TYPESAFE_API_KEY is set in the environment,
  # otherwise the Gemini summary's own category fields.
  classifier: "auto"
  jev_model: "jev-1.13.0"      # pin versions; jev-latest shifts thresholds
  jev_min_confidence: 0.7
  # tag_vocabulary: ["tutorial", "recipe", "travel-guide", "music", "sponsored-or-ad"]

  # Cost ledger (USD per 1M tokens). Set these from your model's pricing page,
  # otherwise Gemini spend reads $0 and the caps below cannot be enforced.
  price_input_per_m: null
  price_output_per_m: null
  jev_price_input_per_m: 0.042
  max_spend_usd: null          # hard stop for one run (CLI: --max-spend 2.50)
  max_total_spend_usd: 15      # hard stop across all runs

# Optional: replace the default category -> folder map (order = prompt order).
# taxonomy:
#   "Saved Music": "Music"
#   "Tech & Coding": "Tech & Coding"
#   "Miscellaneous": "Inbox"
